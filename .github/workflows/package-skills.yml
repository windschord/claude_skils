name: Package Skills

# claude.ai（チャット）へアップロードするスキルzipを生成する。
# - PR / main への push: zipが生成できることを検証し、Artifactとして保存
# - タグ（v*）の push: 生成したzipをGitHub Releaseに添付
# - 手動実行: Artifactとして保存。release_tag を指定すると、mainの最新コミットにタグを作成してReleaseも公開する
#   （GITHUB_TOKENで作ったタグはpushイベントを起こさないため、同じ実行内でReleaseまで行う）

on:
  pull_request:
    paths:
      - '**/SKILL.md'
      - '**/references/**'
      - '**/assets/**'
      - '**/scripts/**'
      - '.github/workflows/package-skills.yml'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'タグを作成してReleaseを公開する場合のタグ名（例: v2.1.0 / v2.1.0-rc.1 ※ハイフン付きはプレリリース）。空ならArtifactのみ'
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # タグ時のRelease作成・アセット添付に必要
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build skill zips
        run: python3 -I scripts/package-skills.py --out dist/skills

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-skills-zips
          path: dist/skills/*.zip
          retention-days: 30

      - name: Create tag (manual release)
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::release_tag を指定した実行は main ブランチで行ってください（現在: $GITHUB_REF）"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::タグ名は v1.2.3 または v1.2.3-rc.1 の形式で指定してください: $TAG"
            exit 1
          fi
          # 再実行できるよう、既存タグが同じコミットを指すなら作成をスキップする
          EXISTING_SHA=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          if [[ -z "$EXISTING_SHA" ]]; then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          elif [[ "$EXISTING_SHA" == "$GITHUB_SHA" ]]; then
            echo "タグ $TAG は既に $GITHUB_SHA を指しています。作成をスキップします。"
          else
            echo "::error::タグ $TAG は既に別のコミット($EXISTING_SHA)を指しています。現在のmain($GITHUB_SHA)とは異なるため中止します。"
            exit 1
          fi

      - name: Attach zips to GitHub Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          (cd dist/skills && sha256sum *.zip > SHA256SUMS)
          cat > dist/release-notes.md <<'EOF'
          ## claude.ai（チャット）へのインストール

          1. 使いたいスキルの `<スキル名>.zip` を下の Assets からダウンロードします
          2. claude.ai の「設定 > 機能 > スキル」からzipをアップロードします

          zipの検証: `sha256sum -c SHA256SUMS`（`SHA256SUMS` と同じフォルダで実行）

          > claude.aiのスキルはAPI・Claude Codeとは同期されません。更新時は新しいzipで再アップロードしてください。
          EOF
          # v1.2.3-rc.1 のようにハイフンを含むタグはプレリリースとして公開する
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/skills/*.zip dist/skills/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/skills/*.zip dist/skills/SHA256SUMS \
              --title "$TAG" --notes-file dist/release-notes.md --generate-notes $PRERELEASE_FLAG
          fi
