# 用語集と検査ポリシー
# 配置: docs/requirements/glossary.yaml
#
# 確認ゲート（記入を始める前に必ず実施する）:
#   1. 入力を「明示された情報」と「不明な情報」に分けて列挙する。
#      このファイル中の <...> は、まだ埋まっていない「不明な情報」を表す。
#   2. 不明な情報ごとに確認質問を作り、ユーザーに質問する。
#   3. 回答を得るまで、用語集の変更・設計・実装のいずれも開始しない。推測で埋めない。

terms:
  - name: <正規の用語>
    definition: <この用語が何を指すか。曖昧さが残らない粒度で書く>
    aliases: [使ってはいけない言い換え1, 言い換え2]   # 要求文に出現すると警告

policy:
  # 要求文に含めてはならない曖昧語。プロジェクト固有の語を追加する
  ambiguous_words:
    - 適切に
    - 適宜
    - 必要に応じて
    - など
    - なるべく
    - 可能な限り
    - 高速
    - 十分
    - 柔軟
    - 簡単に
    - 素早く
    - 使いやすい
    - ユーザーフレンドリー
    - 基本的に
    - 原則として
    - 極力

  # 複数の要求が異なる値を主張してよい asserts のキー（列挙が正当な場合のみ）
  multi_value_keys: []

  # rationale.decided_at からこの日数を超えた有効要求に鮮度警告を出す
  stale_days: 365
